<text x="269.5" y="27" text-anchor="middle" style="font-family:ui-monospace,monospace;font-size:12px;fill:#6b7089">mpx join — amber-ridge-04</text>
<text y="68" class="l" xml:space="preserve" style="animation-name:r0"><tspan x="22" style="fill:#c6c8d1;opacity:.62">  connecting to ws://127.0.0.1:7877/ …</tspan></text>
<text y="88" class="l" xml:space="preserve" style="animation-name:r1"></text>
<text y="108" class="l" xml:space="preserve" style="animation-name:r2"><tspan x="22" style="fill:#c6c8d1;font-weight:700">  joined amber-ridge-04</tspan><tspan style="fill:#c6c8d1;opacity:.62">  amber-ridge-04 · echo · /tmp/work/api</tspan></text>
<text y="128" class="l" xml:space="preserve" style="animation-name:r3"><tspan x="22" style="fill:#c6c8d1;opacity:.62">  you are alice (member) · /help for commands</tspan></text>
<text y="148" class="l" xml:space="preserve" style="animation-name:r4"></text>
<text y="168" class="l" xml:space="preserve" style="animation-name:r5"><tspan x="22" style="fill:#c6c8d1;opacity:.62">  2 in the room</tspan></text>
<text y="188" class="l" xml:space="preserve" style="animation-name:r6"><tspan x="22" style="fill:#c6c8d1">    </tspan><tspan style="fill:#66c2cd">●</tspan><tspan style="fill:#c6c8d1"> bob</tspan><tspan style="fill:#c6c8d1;opacity:.62">  </tspan><tspan style="fill:#dbab79;opacity:.62">host</tspan><tspan style="fill:#c6c8d1;opacity:.62"> </tspan><tspan style="fill:#66c2cd;opacity:.62">mic</tspan></text>
<text y="208" class="l" xml:space="preserve" style="animation-name:r7"><tspan x="22" style="fill:#c6c8d1">    </tspan><tspan style="fill:#d290e4">●</tspan><tspan style="fill:#c6c8d1"> alice</tspan><tspan style="fill:#c6c8d1;opacity:.62">  </tspan><tspan style="fill:#c6c8d1;opacity:.62">you</tspan></text>
<text y="228" class="l" xml:space="preserve" style="animation-name:r8"></text>
<text y="248" class="l" xml:space="preserve" style="animation-name:r9"><tspan x="22" style="fill:#c6c8d1">  </tspan><tspan style="fill:#66c2cd">▸</tspan><tspan style="fill:#c6c8d1"> </tspan><tspan style="fill:#d290e4">alice</tspan><tspan style="fill:#c6c8d1"> proposes </tspan><tspan style="fill:#c6c8d1;font-weight:700">#1</tspan></text>
<text y="268" class="l" xml:space="preserve" style="animation-name:r10"><tspan x="22" style="fill:#c6c8d1">      rewrite the auth middleware to use short-lived JWTs</tspan></text>
<text y="288" class="l" xml:space="preserve" style="animation-name:r11"><tspan x="22" style="fill:#c6c8d1">      </tspan><tspan style="fill:#c6c8d1;opacity:.62">[</tspan><tspan style="fill:#c6c8d1">1/2 ✓ · 1 pending · 20s left</tspan><tspan style="fill:#c6c8d1;opacity:.62">]</tspan><tspan style="fill:#c6c8d1;opacity:.62">   /y #1  /n #1  /amend #1 …</tspan></text>
<text y="308" class="l" xml:space="preserve" style="animation-name:r12"><tspan x="22" style="fill:#c6c8d1">      </tspan><tspan style="fill:#c6c8d1;opacity:.62">[</tspan><tspan style="fill:#c6c8d1">1/2 ✓ · 1 ✗</tspan><tspan style="fill:#c6c8d1;opacity:.62">]</tspan><tspan style="fill:#c6c8d1">  </tspan><tspan style="fill:#e88388">✗</tspan><tspan style="fill:#66c2cd">bob</tspan></text>
<text y="328" class="l" xml:space="preserve" style="animation-name:r13"><tspan x="22" style="fill:#c6c8d1">  </tspan><tspan style="fill:#e88388">✗</tspan><tspan style="fill:#c6c8d1"> </tspan><tspan style="fill:#c6c8d1;font-weight:700">#1</tspan><tspan style="fill:#c6c8d1"> rejected</tspan><tspan style="fill:#c6c8d1;opacity:.62">  — vetoed: we agreed to keep sessions server-side</tspan></text>
<text y="348" class="l" xml:space="preserve" style="animation-name:r14"><tspan x="22" style="fill:#c6c8d1">  </tspan><tspan style="fill:#c6c8d1;opacity:.62">💬</tspan><tspan style="fill:#c6c8d1"> </tspan><tspan style="fill:#66c2cd">bob</tspan><tspan style="fill:#c6c8d1;opacity:.62">:</tspan><tspan style="fill:#c6c8d1"> lets ask it to compare the two first</tspan></text>
