ll:#c6c8d1;font-weight:700">❯</tspan></text><text y="415" xml:space="preserve"><tspan x="18" style="fill:#dbab79">2 awaiting a decision</tspan><tspan style="fill:#c6c8d1">                                       </tspan><tspan style="fill:#c6c8d1;opacity:.6">1 turn</tspan></text></g>
<g class="f" style="animation-name:f1"><rect y="40" width="548" height="392" fill="#1c1e26"/><text y="58" xml:space="preserve"><tspan x="18" style="fill:#66c2cd;font-weight:700">amber-ridge-04</tspan><tspan style="fill:#c6c8d1;opacity:.6">  ·  codex  ·  consensus 20s</tspan><tspan style="fill:#c6c8d1">     </tspan><tspan style="fill:#c6c8d1;opacity:.6">2 seats · </tspan><tspan style="fill:#c6c8d1">encrypted</tspan></text><text y="75" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">──────────────────────────────────────────────────────────────────</tspan></text><text y="160" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">── sending to the model (alice) ──────────────────────────────────</tspan></text><text y="177" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">  codex session th_demo</tspan></text><text y="194" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">  codex asks: Should the v1 pagination API keep working after this</tspan></text><text y="211" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">  change?</tspan></text><text y="228" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">  the room's answer will go back as the next message</tspan></text><text y="245" xml:space="preserve"><tspan x="18" style="fill:#d290e4">│</tspan><tspan style="fill:#c6c8d1"> Two ways to do this, and they are not equivalent.</tspan></text><text y="262" xml:space="preserve"><tspan x="18" style="fill:#d290e4">│</tspan></text><text y="279" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">── turn complete ─────────────────────────────────────────────────</tspan></text><text y="296" xml:space="preserve"><tspan x="18" style="fill:#71bef2">⑂</tspan><tspan style="fill:#c6c8d1"> </tspan><tspan style="fill:#c6c8d1;font-weight:700">Should the v1 pagination API keep working after this change?</tspan></text><text y="313" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1">   </tspan><tspan style="fill:#c6c8d1;font-weight:700">a</tspan><tspan style="fill:#c6c8d1">  Shim it</tspan><tspan style="fill:#c6c8d1;opacity:.6">   /y #2</tspan></text><text y="330" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">      keep v1 alive behind an adapter, nobody has to move</tspan></text><text y="347" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1">   </tspan><tspan style="fill:#c6c8d1;font-weight:700">b</tspan><tspan style="fill:#c6c8d1">  Migrate</tspan><tspan style="fill:#c6c8d1;opacity:.6">   /y #3</tspan></text><text y="364" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">      drop v1 and update every caller in one go</tspan></text><text y="381" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">──────────────────────────────────────────────────────────────────</tspan></text><text y="398" xml:space="preserve"><tspan x="18" style="fill:#66c2cd">alice</tspan><tspan style="fill:#c6c8d1"> </tspan><tspan style="fill:#c6c8d1;font-weight:700">❯</tspan></text><text y="415" xml:space="preserve"><tspan x="18" style="fill:#dbab79">2 awaiting a decision</tspan><tspan style="fill:#c6c8d1">                                       </tspan><tspan style="fill:#c6c8d1;opacity:.6">1 turn</tspan></text></g>
