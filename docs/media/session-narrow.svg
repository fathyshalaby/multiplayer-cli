<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 432" width="548" height="432" role="img" aria-label="A recorded multiplayer-cli session: someone proposes a change, the agent stops at a fork and asks whether the v1 API should keep working, the room picks a direction, and the agent carries on from there.">
