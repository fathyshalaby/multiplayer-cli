ind an adapter, nobody has to move</tspan></text><text y="245" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1">   </tspan><tspan style="fill:#c6c8d1;font-weight:700">b</tspan><tspan style="fill:#c6c8d1">  Migrate</tspan><tspan style="fill:#c6c8d1;opacity:.6">   /y #3</tspan></text><text y="262" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">      drop v1 and update every caller in one go</tspan></text><text y="279" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">  the room chose b: Migrate (2/2 approvals)</tspan></text><text y="296" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">── sending to the model (the room) ───────────────────────────────</tspan></text><text y="313" xml:space="preserve"><tspan x="18" style="fill:#d290e4">│</tspan><tspan style="fill:#c6c8d1"> Migrating. v1 callers get a deprecation warning for one</tspan></text><text y="330" xml:space="preserve"><tspan x="18" style="fill:#d290e4">│</tspan><tspan style="fill:#c6c8d1"> release.</tspan></text><text y="347" xml:space="preserve"><tspan x="18" style="fill:#d290e4">│</tspan></text><text y="364" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">── turn complete ─────────────────────────────────────────────────</tspan></text><text y="381" xml:space="preserve"><tspan x="18" style="fill:#c6c8d1;opacity:.6">──────────────────────────────────────────────────────────────────</tspan></text><text y="398" xml:space="preserve"><tspan x="18" style="fill:#66c2cd">alice</tspan><tspan style="fill:#c6c8d1"> </tspan><tspan style="fill:#c6c8d1;font-weight:700">❯</tspan></text><text y="415" xml:space="preserve"><tspan x="18" style="fill:#dbab79">1 awaiting a decision</tspan><tspan style="fill:#c6c8d1">                                      </tspan><tspan style="fill:#c6c8d1;opacity:.6">2 turns</tspan></text></g>
