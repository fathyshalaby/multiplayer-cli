name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.11", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Browser-seat tests skip themselves when Playwright is absent, so the
      # matrix stays fast; the browser job below covers them once.
      - run: npm test

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Typechecks the extension, bundles it, and proves the bundle loads —
      # the extension test requires it against a stubbed editor API.
      - run: node scripts/build-extension.mjs
      - run: node --test dist/test/extension.test.js
      - run: cd extension && npx vsce package --no-dependencies --out multiplayer-cli.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: multiplayer-cli-vsix
          path: extension/multiplayer-cli.vsix

  # The stubbed-API tests prove the extension's logic; only a real editor can
  # prove VS Code will load the bundle and activate it. That has broken before,
  # and every other test passed while it was broken.
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-extension.mjs
      - run: xvfb-run -a npm run test:vscode

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install playwright && npx playwright install --with-deps chromium
      - run: npm test
