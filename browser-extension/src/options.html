<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>mpx browser runner</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 480px; margin: 2rem auto; color: #222; }
    label { display: block; margin-top: 0.75rem; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 0.4rem; margin-top: 0.25rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    p.hint { color: #666; font-size: 12px; }
    p.status { font-weight: 600; }
  </style>
</head>
<body>
  <h2>Offer this tab to an mpx room</h2>
  <p class="hint">
    Paste the room's WebSocket URL and token the same way a terminal seat would join it
    (<code>mpx join &lt;url&gt;</code>). This tab offers itself as a runner — the host must have
    started the room with <code>--pool</code> for the room to accept it.
  </p>
  <label>Room WebSocket URL (ws:// or wss://, including /r/&lt;room&gt;)
    <input id="roomUrl" placeholder="wss://example.com/r/amber-ridge-04" />
  </label>
  <label>Room name
    <input id="roomName" placeholder="amber-ridge-04" />
  </label>
  <label>Room token (leave blank for an unencrypted room)
    <input id="roomToken" type="password" />
  </label>
  <label>Your name in the room
    <input id="seatName" placeholder="bob" />
  </label>
  <label>Backend label shown to the room
    <input id="backendLabel" placeholder="chatgpt-web" />
  </label>
  <button id="save">Save</button>
  <p id="status" class="status"></p>
  <script type="module" src="./options.js"></script>
</body>
</html>
